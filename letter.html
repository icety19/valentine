<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>For You 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center pink">

  <div class="card soft">
    <img src="img/envelope.png"
         class="envelope"
         onclick="openLetter()">
    <p class="hint">แตะซองจดหมายเบา ๆ 💕</p>
  </div>

  <div id="letterBox" class="popup">
    <h3>ถึงคนพิเศษของฉัน 💖</h3>
    <p class="letter-text">
      ตั้งแต่มีเธอ<br>
      โลกของเค้าก็อบอุ่นขึ้นทุกวัน<br>
      ขอบคุณที่อยู่ข้างกันเสมอ ❤️
    </p>
    <button onclick="nextPage()">ไปดูความทรงจำของเรา ✨</button>
  </div>

<script src="script.js"></script>
</body>
</html>
